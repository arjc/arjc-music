<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chords</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
  </head>
  <body
    class="font-sans bg-black text-white min-h-screen flex flex-col custom-bg"
  >
    <!-- Top bar -->
    <div class="md:px-16 flex justify-center md:justify-between items-center md:gap-0 bg-black py-2 shadow-md shadow-black w-full">
        <!-- LHS -->
        <div class="flex flex-row gap-2">
          <a
            href="/"
            class="flex items-center gap-2 no-underline cursor-default"
          >
            <img
              src="assets/face.webp"
              onclick="window.open('https://arjc.me')"
              alt="achu"
              class="h-12 align-middle rounded-full cursor-pointer"
            />
            <span class="text-white text-2xl font-semibold">Chords</span>
          </a>
        </div>
        <!-- RHS -->
        <div class="hidden md:flex flex-row items-center justify-center gap-4">
          <span>volume</span>
          <input type="range" name="volume" id="volume"/>
        </div>
    </div>

    <!-- Sambhavam -->
    <div
      class="w-screen h-[77vh] flex justify-center items-center text-white text-4xl font-bold hero-container overflow-y-auto"
    >
      <!-- library -->
      <div class="w-full max-w-6xl px-4">
        <h2 class="text-3xl font-bold mb-6">Library (work in progress)</h2>
        <div id="songList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          <!-- Songs will be populated here by JS -->
        </div>
      </div>
    </div>

    <!-- bottom bar -->
    <div
      class="absolute left-0 bottom-0 bg-black w-screen flex items-center justify-between pt-4 pb-6 py-2 px-5 gap-4"
    >
      <!-- info -->
      <div class="flex items-center">
        <img
          src="assets/cover/test.png"
          alt="cover"
          class="h-16 w-16 rounded-md mr-4"
        />
        <div class="flex flex-col">
          <span id="songName"></span>
          <span class="opacity-80 text-xs" id="artistName"></span>
        </div>
      </div>
      <!-- ctrl -->
      <div class="flex items-center gap-5 md:gap-10 justify-center">
        <button onclick="prev()" class="text-3xl hover:opacity-70 cursor-pointer">❮</button>
        <button onclick="play()" class="border-2 rounded-full w-10 h-10 hover:opacity-70 cursor-pointer flex items-center justify-center">&gt;ton>
        <button onclick="next()" class="text-3xl hover:opacity-70 cursor-pointer">❯</button>
      </div>
      <div class="hidden sm:block">
        <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
      </div>
    </div>
    <input
      type="range"
      min="0"
      max="1000"
      class="w-screen absolute bottom-0 range pr-6 bg-black"
      id="progressBar"
      value="0"
    />
    <script src="script.js"></script>
  </body>
</html>
